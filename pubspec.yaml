name: tsuzuki
description: "Aplikasi pelacak progres Anime & Komik"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  supabase_flutter: ^2.18.3
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.6
  persistent_device_id: ^2.0.0
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  file_selector: ^1.0.3
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  path: ^1.9.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  generate: true


  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/logo/

# Konfigurasi Ikon Aplikasi
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo.png" 
  min_sdk_android: 21

# Konfigurasi Splash Screen
flutter_native_splash:
  color: "#0F1613" 
  image: assets/logo/logo.png
  android_12:
    image: assets/logo/logo.png
    color: "#0F1613"